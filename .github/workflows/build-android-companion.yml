name: Android Companion APK

on:
  push:
    branches: [ main ]
    paths: [ 'AndroidCompanion/**', '.github/workflows/build-android-companion.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: AndroidCompanion
        run: gradle :app:assembleDebug
      - name: Verify APK
        run: test -f AndroidCompanion/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MobileMTPBackup-Companion-v0.6-debug-apk
          path: AndroidCompanion/app/build/outputs/apk/debug/app-debug.apk
