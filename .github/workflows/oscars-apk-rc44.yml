name: Oscars APK RC44

on:
  push:
    branches: [oscars-apk-rc44-try]
    paths:
      - 'oscars-src-v2.part*'
      - '.github/workflows/oscars-apk-rc44.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and validate Oscars source
        shell: bash
        run: |
          set -euo pipefail
          cat oscars-src-v2.part00 oscars-src-v2.part01 oscars-src-v2.part02 | base64 -d > /tmp/oscars.zip
          sha256sum /tmp/oscars.zip
          unzip -t /tmp/oscars.zip
          mkdir -p /tmp/oscars
          unzip -q /tmp/oscars.zip -d /tmp/oscars
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source
        working-directory: /tmp/oscars
        run: |
          node scripts/verify-release.mjs
          node scripts/verify-android-current.mjs
      - name: Build debug APK
        working-directory: /tmp/oscars/android-native
        run: gradle --no-daemon clean lintDebug assembleDebug
      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cp /tmp/oscars/android-native/app/build/outputs/apk/debug/app-debug.apk /tmp/out/oscars-v0.9.5-rc44-debug.apk
          sha256sum /tmp/out/oscars-v0.9.5-rc44-debug.apk | tee /tmp/out/oscars-v0.9.5-rc44-debug.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oscars-v0.9.5-rc44-android-apk
          path: /tmp/out/*
          if-no-files-found: error
