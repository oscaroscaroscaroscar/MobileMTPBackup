name: MobileMTPBackup Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore Windows app
        run: dotnet restore MobileMTPBackup/MobileMTPBackup.csproj
      - name: Restore protocol self-test
        run: dotnet restore ProtocolSelfTest/ProtocolSelfTest.csproj
      - name: Build Windows app
        run: dotnet build MobileMTPBackup/MobileMTPBackup.csproj -c Release --no-restore
      - name: Run Wi-Fi protocol self-test
        run: dotnet run --project ProtocolSelfTest/ProtocolSelfTest.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish MobileMTPBackup/MobileMTPBackup.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/win-x64/MobileMTPBackup.exe')) { throw 'MobileMTPBackup.exe missing.' }
          $size=(Get-Item 'publish/win-x64/MobileMTPBackup.exe').Length
          Write-Host "EXE size: $size bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: MobileMTPBackup-v5.37-Windows-x64
          path: publish/win-x64/
      - name: Build cumulative master package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path master\SOURCE,master\WINDOWS_BUILD,master\HISTORY | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','master','publish') } | ForEach-Object { Copy-Item $_.FullName master\SOURCE -Recurse -Force }
          Copy-Item publish\win-x64\* master\WINDOWS_BUILD -Recurse -Force
          git bundle create master\HISTORY\MobileMTPBackup-history.bundle --all
          git log --date=iso --pretty=format:'%H %ad %s' | Out-File -Encoding utf8 master\HISTORY\COMMIT_HISTORY.txt
          @"
          Mobile MTP Backup MASTER package
          Version: 5.37
          Android Companion source: 0.12.0
          Google Drive target: My Drive/Min enhet remains preferred over a raw Google Drive volume root. v5.37 classifies the selected root, performs the write/read probe, then writes a sanitized google-drive-target diagnostic report under MobileMTPBackup/_diagnostics containing app version, detected root, root kind, backup target, volume label and available bytes. Google account details and OAuth credentials are not included or used.
          Existing .partial finalization, SHA-256 verification and incremental backup logic remain in the real backup path. Google Drive for desktop performs cloud synchronization.
          Direct Google Drive API upload is not enabled and would require OAuth/client authorization.
          Companion 0.12 robustness remains: client failures are isolated, GET/HASH use direct MediaStore ID lookup, and Android 13+ image/video permissions are tracked independently.
          Wi-Fi pairing: 64-bit random hexadecimal secret, regenerated when the Android app starts.
          Wi-Fi authentication: per-connection nonce + HMAC-SHA256; pairing secret is not sent in cleartext.
          Wi-Fi protected payloads: HELLO, LIST metadata, HASH replies and media file chunks use AES-256-GCM.
          CI protocol self-test remains: corrupted AES-GCM HELLO must be rejected, fresh connection recovery must succeed, then LIST, GET, HASH, AAD, SHA-256, .partial finalization and incremental skip logic are verified.
          Wi-Fi diagnostics report the actual Windows assembly version, recommend Companion 0.12 centrally and never include the pairing secret.
          The initial nonce frame and errors before successful authentication are not TLS encrypted.
          Commit: $env:GITHUB_SHA
          Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')
          Includes: current full source tree, published Windows x64 build, Android Companion source, ProtocolSelfTest source, and complete Git history bundle.
          "@ | Out-File -Encoding utf8 master\MASTER_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MobileMTPBackup_MASTER_LATEST
          path: master/
